[project]
name = "neuromr-engine"
version = "0.1.0"
description = "NeuroMR-PRO compute engine"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pydicom>=3.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "cyclonedx-bom>=5",
    "pip-licenses>=5",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuromr_engine"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
