packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - electron
  - esbuild
# dcmjs (via Cornerstone metadata) pins adm-zip 0.5.17, which has known ZIP-parsing flaws; 0.6.1 fixes them.
# The renderer never runs dcmjs' ZIP code, but the production tree should not carry the advisory.
overrides:
  adm-zip: 0.6.1
